version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lmi_platform_app
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=file:./dev.db
      - AUTH_SECRET=production-secret-lmi-platform-key-32-chars-min
      - AI_PROVIDER=local
      - NODE_ENV=production
    restart: unless-stopped

